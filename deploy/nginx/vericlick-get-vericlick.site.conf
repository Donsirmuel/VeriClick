server {
    listen 80;
    server_name get-vericlick.site www.get-vericlick.site;

    root /var/www/vericlick-frontend/dist;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin (Jazzmin) at https://get-vericlick.site/admin/
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Collected static files (admin/Jazzmin CSS, DRF, tracker.js) served by
    # Django/WhiteNoise.
    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /r/ {
        proxy_pass http://127.0.0.1:8000/r/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /suspicious/ {
        proxy_pass http://127.0.0.1:8000/suspicious/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:8000/robots.txt;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000/sitemap.xml;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
