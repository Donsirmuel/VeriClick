<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>VeriClick — Protect Your Links From Bots & Suspicious Traffic</title>
    <meta name="title" content="VeriClick — Protect Your Links From Bots & Suspicious Traffic" />
    <meta name="description" content="VeriClick checks every click against your IP rules and bot detection before it reaches your page, and explains exactly why each request was flagged. Free during beta." />

    <!-- Canonical -->
    <link rel="canonical" href="https://vericlick.io/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vericlick.io/" />
    <meta property="og:title" content="VeriClick — Protect Your Links From Bots & Suspicious Traffic" />
    <meta property="og:description" content="Checks every click against your IP rules and bot detection, with a plain-language reason for every decision. Free during beta." />
    <meta property="og:image" content="https://vericlick.io/og-image.png" />
    <meta property="og:site_name" content="VeriClick" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://vericlick.io/" />
    <meta property="twitter:title" content="VeriClick — Protect Your Links From Bots & Suspicious Traffic" />
    <meta property="twitter:description" content="Checks every click against your IP rules and bot detection, with a plain-language reason for every decision. Free during beta." />
    <meta property="twitter:image" content="https://vericlick.io/og-image.png" />

    <!-- Search Console Verification -->
    <meta name="google-site-verification" content="YOUR_GOOGLE_VERIFICATION_CODE" />
    <meta name="msvalidate.01" content="YOUR_BING_VERIFICATION_CODE" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "VeriClick",
      "applicationCategory": "SecurityApplication",
      "description": "VeriClick checks every click against your IP rules and bot detection before it reaches your page, with a plain-language reason for each decision. Free during beta.",
      "url": "https://vericlick.io/",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
