<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>VeriClick — Protect Your Links From Bots & Suspicious Traffic</title>
    <meta name="title" content="VeriClick — Protect Your Links From Bots & Suspicious Traffic" />
    <meta name="description" content="VeriClick checks every click against your IP rules and bot detection before it reaches your page, and explains exactly why each request was flagged." />

    <!-- Canonical -->
    <link rel="canonical" href="https://vericlick.site/" />

    <!-- Open Graph / Facebook -->  
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vericlick.site/" />
    <meta property="og:title" content="VeriClick — Protect Your Links From Bots & Suspicious Traffic" />
    <meta property="og:description" content="Checks every click against your IP rules and bot detection, with a plain-language reason for every decision." />
    <!-- Versioned filename on purpose. Facebook, LinkedIn and WhatsApp cache the
         image bytes against the URL and will keep serving a stale preview long
         after the file is replaced. Replacing the picture means bumping this
         number, not overwriting the file. -->
    <meta property="og:image" content="https://vericlick.site/og-image-v2.png" />
    <meta property="og:image:secure_url" content="https://vericlick.site/og-image-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="808" />
    <meta property="og:image:alt" content="VeriClick — bot protection for your site and your links" />
    <meta property="og:site_name" content="VeriClick" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://vericlick.site/" />
    <meta property="twitter:title" content="VeriClick — Protect Your Links From Bots & Suspicious Traffic" />
    <meta property="twitter:description" content="Checks every click against your IP rules and bot detection, with a plain-language reason for every decision." />
    <meta property="twitter:image" content="https://vericlick.site/og-image-v2.png" />
    <meta property="twitter:image:alt" content="VeriClick — bot protection for your site and your links" />

    <!-- Search Console Verification (filled at build time via VITE_* env) -->
    <meta name="google-site-verification" content="%VITE_GOOGLE_SITE_VERIFICATION%" />
    <meta name="msvalidate.01" content="%VITE_BING_VERIFICATION%" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "VeriClick",
      "applicationCategory": "SecurityApplication",
      "description": "VeriClick checks every click against your IP rules and bot detection before it reaches your page, with a plain-language reason for each decision.",
      "url": "https://vericlick.site/",
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "USD",
        "lowPrice": "25",
        "highPrice": "200",
        "offerCount": "6"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
