<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; color: #333; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { text-align: center; padding: 3rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { font-size: 0.875rem; color: #999; }
    .spinner { width: 32px; height: 32px; border: 3px solid #eee; border-top-color: #333; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // Honeypot: pretend to redirect but actually just spin forever.
    // Bots that follow JavaScript will waste time here.
    setTimeout(function() { window.location.href = "about:blank"; }, 30000);
  </script>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Just a moment...</h1>
    <p>Verifying your connection.</p>
  </div>
</body>
</html>
