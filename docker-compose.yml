# Shared by the backend and the scheduler: they are the same image with the
# same configuration, and a scheduler running against different settings than
# the app is a class of bug nobody finds until an email goes to the wrong URL.
x-backend-env: &backend-env
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS in .env}
  PUBLIC_TRACKING_BASE_URL: ${PUBLIC_TRACKING_BASE_URL:?set PUBLIC_TRACKING_BASE_URL in .env}
  EDGE_OPERATOR_API_KEY: ${EDGE_OPERATOR_API_KEY:-}
  DATACENTER_BLOCKING_ENABLED: ${DATACENTER_BLOCKING_ENABLED:-true}
  TRUST_X_FORWARDED_PROTO: "true"
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-VeriClick <noreply@vericlick.site>}
  SITE_URL: ${SITE_URL:-https://vericlick.site}
  # Host the anti-bot snippet points at. Compose only forwards what is
  # listed here, so without this line setting it in .env does nothing.
  SCRIPT_BASE_URL: ${SCRIPT_BASE_URL:-}
  BACHS_API_KEY: ${BACHS_API_KEY:-}
  BACHS_WEBHOOK_SECRET: ${BACHS_WEBHOOK_SECRET:-}
  BACHS_BASE_URL: ${BACHS_BASE_URL:-https://sandbox-api.bachs.io}
  BACHS_WEBHOOK_TOLERANCE_SECONDS: ${BACHS_WEBHOOK_TOLERANCE_SECONDS:-300}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Single source of truth: this is the ONLY database value anywhere. The
      # backend uses it to connect, and us db container seeds its initial
      # superuser + database from it on first start (see deploy/db-entrypoint.sh).
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    entrypoint: ["/usr/local/bin/vericlick-db-entrypoint.sh"]
    command: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-entrypoint.sh:/usr/local/bin/vericlick-db-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./vericlick-backend
    # Named explicitly because the scheduler runs the same image. Relying on
    # Compose's implicit <project>-backend name would also tie the rollback
    # tags in deploy.sh to the directory the repo happens to sit in.
    image: vericlick-backend:latest
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy

  # Billing reminders on a timer.
  #
  # There is no grace period after a plan expires, so the warning email is the
  # only thing standing between a customer and losing access. The same checks
  # run lazily on an owner's own requests — which is no help at all for the
  # person this is for: the one who is not logging in.
  # Runs the backend image rather than building its own. Two builds of one
  # Dockerfile would be two images to keep in step, and `deploy.sh rollback`
  # only moves the backend tag — so a separate scheduler image would stay on
  # the new code after a rollback put the app back on the old.
  scheduler:
    image: vericlick-backend:latest
    restart: unless-stopped
    environment: *backend-env
    command: python manage.py check_billing --interval 3600
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./vericlick-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in .env}
        VITE_SITE_URL: ${VITE_SITE_URL:?set VITE_SITE_URL in .env}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_SITE_VERIFICATION: ${VITE_GOOGLE_SITE_VERIFICATION:-}
        VITE_BING_VERIFICATION: ${VITE_BING_VERIFICATION:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESSES: ${SITE_ADDRESSES:?set SITE_ADDRESSES in .env}
    volumes:
      # Cloudflare Origin TLS cert + key (manual cert, no ACME).
      - ./certs/cloudflare:/etc/caddy/certs:ro
      # Caddy state persists across restarts.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
