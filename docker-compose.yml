services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vericlick}
      POSTGRES_USER: ${POSTGRES_USER:-vericlick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vericlick} -d ${POSTGRES_DB:-vericlick}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./vericlick-backend
    restart: unless-stopped
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-vericlick}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vericlick}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS in .env}
      PUBLIC_TRACKING_BASE_URL: ${PUBLIC_TRACKING_BASE_URL:?set PUBLIC_TRACKING_BASE_URL in .env}
      TRUST_X_FORWARDED_PROTO: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./vericlick-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in .env}
        VITE_SITE_URL: ${VITE_SITE_URL:?set VITE_SITE_URL in .env}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Public hostname(s) this server answers for; Caddy auto-issues the
      # Let's Encrypt certificates for them.
      SITE_ADDRESSES: ${SITE_ADDRESSES:vendora.page,www.vendora.page}
    volumes:
      # ACME certs + config persist across container restarts/updates.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
